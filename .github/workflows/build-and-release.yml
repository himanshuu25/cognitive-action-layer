name: Build and Release CAL

on:
  push:
    tags:
      - 'v*' # Trigger when a version tag like v1.0.0 is pushed
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. v1.0.0) - used for manual triggers'
        required: true
        default: 'v1.0.0-draft'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pywin32

      - name: Build excel_mcp.exe
        run: pyinstaller --clean excel_mcp.spec

      - name: Rename excel_mcp.exe with version
        id: rename
        run: |
          $TAG_NAME = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $TAG_NAME = "${{ github.event.inputs.version }}"
          }
          $NEW_NAME = "CAL_Installer_$TAG_NAME.exe"
          Rename-Item -Path dist\excel_mcp.exe -NewName $NEW_NAME
          echo "file_name=$NEW_NAME" >> $env:GITHUB_OUTPUT

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/${{ steps.rename.outputs.file_name }}
          generate_release_notes: true
